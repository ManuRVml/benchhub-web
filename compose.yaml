services:
  bff:
    build:
      context: ${BFF_CONTEXT:-../eco-comparator-bff}
      target: mock
    environment:
      - MOCK_SCENARIO=${MOCK_SCENARIO:-default}
      - MOCK_LATENCY_MS=${MOCK_LATENCY_MS:-0}
      - MOCK_ROLE=${MOCK_ROLE:-analyst_creator}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-3000}
    expose:
      - '3001'

  web:
    build: .
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      - bff
