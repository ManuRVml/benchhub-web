name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify
        run: pnpm verify

      - name: Architecture check
        run: pnpm check:architecture

      - name: Architecture self-test
        run: pnpm check:architecture:selftest

      - name: Coverage
        run: pnpm test:coverage

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  e2e-mock:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests (mock mode)
        run: E2E_PORT=5173 pnpm test:e2e

  e2e-stack:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BFF_REPOSITORY (owner/name) must be set in the repo settings
      - name: Checkout BFF repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BFF_REPOSITORY }}
          path: bff

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and start stack
        run: BFF_CONTEXT=bff docker compose up -d --build

      - name: Wait for BFF health check
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8088/api/v1/health > /dev/null 2>&1; then
              echo "BFF is healthy"
              exit 0
            fi
            echo "Waiting for BFF... attempt $i/30"
            sleep 2
          done
          echo "BFF did not become healthy"
          exit 1

      - name: Run e2e tests (stack mode)
        run: STACK_URL=http://127.0.0.1:8088 pnpm test:e2e:stack

      - name: Stop stack
        if: always()
        run: docker compose down
